# Issue #19 : chaque PR vers main (et chaque push sur main) rejoue les tests de
# la base et vérifie le site client. Aucun secret : tout tourne contre une base
# Supabase locale démarrée dans le runner.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Un nouveau push sur une PR annule l'exécution en cours ; sur main, chaque
# exécution va jusqu'au bout.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Même version qu'en local : elle fixe aussi les images Docker de Supabase.
  SUPABASE_CLI_VERSION: 2.105.0
  # Services inutiles ici (on garde db, kong et rest).
  SUPABASE_EXCLUDE: analytics,edge-runtime,functions,imgproxy,inbucket,meta,realtime,storage,studio,vector
  # Salon créé par supabase/seed.sql.
  SALON_ID_SEED: 11111111-1111-1111-1111-111111111111

jobs:
  base:
    name: base
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Démarrer Supabase (migrations + seed)
        run: supabase start -x "$SUPABASE_EXCLUDE"

      - name: Tests pgTAP
        run: supabase test db

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Démarrer Supabase (migrations + seed)
        working-directory: .
        run: supabase start -x "$SUPABASE_EXCLUDE"

      # Clé anon de démonstration locale : publique, valable seulement pour
      # cette base jetable. Masquée quand même dans les journaux.
      - name: Variables du site depuis la base locale
        working-directory: .
        run: |
          eval "$(supabase status -o env)"
          echo "::add-mask::$ANON_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_SALON_ID=$SALON_ID_SEED"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Échoue si / devient dynamique (ensureStatic) ou si le salon est
      # introuvable (nomDuSalon).
      - run: npm run build
