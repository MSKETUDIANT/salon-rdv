name: salon_pro
description: "salon-rdv : application pro (coiffeurs et gérant)."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.4
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Tests des adaptateurs Supabase (#47) : MockClient simule l'API, sans base.
  # Déjà présent en dépendance de supabase_flutter.
  http: ^1.6.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true

  # Photo du salon en bandeau de l'accueil (#72) : celle du site
  # (web/public/accueil-salon.webp), par défaut tant que le salon ne peut pas
  # envoyer la sienne (#74).
  assets:
    - assets/images/salon-defaut.webp

  # Polices de la charte (docs/charte-graphique.md §3), embarquées comme sur le
  # site : aucun téléchargement au lancement. Versions variables (licence OFL,
  # fichiers *-OFL.txt).
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf

# Icône de l'app (#55) : « S » blanc sur fond accent, en Newsreader. Sources
# dans assets/icone/ (générées depuis la police, voir pro/README.md). Après
# un changement : dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icone/icone.png"
  adaptive_icon_background: "#1F5C4A"
  adaptive_icon_foreground: "assets/icone/icone-premier-plan.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icone/icone.png"
    background_color: "#FAFAF7"
    theme_color: "#1F5C4A"
