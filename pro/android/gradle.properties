# 2 Go : la machine de dev a 7 Go de RAM, partagés avec Docker (Supabase) et
# l'émulateur ; le modèle Flutter demandait 8 Go et le JVM ne démarrait pas.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
